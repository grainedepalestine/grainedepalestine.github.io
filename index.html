<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graine de Palestine — FLE A1</title>
<style>
  :root {
    --bg: #f7f4ec; --card: #ffffff; --ink: #2b2b2b; --muted: #6b6b6b;
    --green: #2f7d4a; --red: #c0392b; --line: #e3ddd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .band { height: 8px; background: linear-gradient(90deg, #000 0 25%, #fff 25% 50%, var(--green) 50% 75%, var(--red) 75%); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 2rem; margin: 0 0 4px; color: var(--green); }
  .sub { color: var(--muted); margin: 0 0 32px; font-size: 1.1rem; }
  h2 { font-size: 1.2rem; margin: 0 0 12px; }
  .list { display: grid; gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 20px; color: var(--muted);
  }
  footer { text-align: center; color: var(--muted); font-size: .9rem; padding: 0 16px 32px; }
</style>
</head>
<body>
<div class="band"></div>
<main>
  <h1>🌱 Graine de Palestine</h1>
  <p class="sub">Activités interactives de français (FLE, niveau A1) pour apprenants arabophones</p>

  <h2>Activités</h2>
  <div class="list">
    <div class="card">Les premières activités arrivent bientôt.</div>
  </div>
</main>
<footer>Graine de Palestine</footer>
</body>
</html>
